      text:
        - lang: zh-Hans
          text: "处理时间交错且效应随时间增长，因此不能用双向固定效应回归。"
          is_original: true
        - lang: en
          text: "Treatment timing is staggered and effects grow over time, so a two-way fixed effects regression cannot be used."
          is_original: false
          machine_translated: true
          translation_of: zh-Hans
          translator: "interviewer model"
      provenance:
        origin: contributor
        actor_id: econ-001
        created_at: "2026-11-05T09:40:00Z"
        endorsement: endorsed
        validation: unvalidated
        evidence_refs:
          - { kind: code_location, file: "internal/reference/run.R", line_start: 40, line_end: 52 }
    chosen_option:
      statement_id: s-002
      text:
        - { lang: en, text: "Group-time ATTs with not-yet-treated controls, aggregated by cohort size.", is_original: true }
      provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T09:41:00Z", endorsement: endorsed, validation: unvalidated }
failure_modes:
  - failure_mode_id: fm-twfe
    decision_id: cd-estimator
    description:
      statement_id: s-010
      text:
        - lang: en
          text: "Estimate the effect with a static two-way fixed effects regression of log employment on a post-treatment indicator."
          is_original: true
      provenance:
        origin: llm_suggested
        model: { provider: anthropic, model_id: claude-opus-5-5, client: "illustrative" }
        created_at: "2026-11-05T10:05:00Z"
        endorsement: edited_then_endorsed
        exposure: not_applicable
        endorsed_by: econ-001
        endorsed_at: "2026-11-05T10:07:00Z"
        validation: unvalidated
    why_incorrect:
      statement:
        statement_id: s-011
        text:
          - { lang: en, text: "With staggered timing and dynamic effects, TWFE uses already-treated units as controls and can assign negative weights, biasing the estimate toward zero here.", is_original: true }
        provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T10:09:00Z", endorsement: endorsed, validation: unvalidated }
      citations:
        - { title: "Difference-in-differences with variation in treatment timing", authors: ["Goodman-Bacon, A."], year: 2021, venue: "Journal of Econometrics", evidence_level: U }
    realism_warrant:
      statement:
        statement_id: s-012
        text:
          - { lang: en, text: "Standard practice before 2020 and still common in RA code; the contributor's own first draft used it.", is_original: true }
        provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T10:10:00Z", endorsement: endorsed, validation: unvalidated }
      warrant_types: [contributor_research_experience, methodological_literature]
      observed_in_practice: own_project
    validity_layer: statistical
    # Static TWFE here is also an estimand–estimator mismatch (verifier protocol §9).
    secondary_validity_layers: [interpretation]
    status: conditional
    status_claimed_by_contributor: conditional
    status_classifications:
      - { classifier_id: reviewer-01, status: conditional, rationale: "Conditional on effects that differ across cohorts and grow with event time; the recorded event-study diagnostic shows this on the main data and on both hidden-variant families used for grading.", blind: true, round: 1 }
      - { classifier_id: reviewer-02, status: conditional, rationale: "Bias of static TWFE under heterogeneous timing effects is established; the recorded heterogeneity diagnostics on the graded data show that the condition holds.", blind: true, round: 1 }
    conditions:
      - statement_id: s-013
        text:
          - { lang: en, text: "Wrong when effects are heterogeneous across cohorts or time; the event-study evidence in the paper shows growing effects.", is_original: true }
        provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T10:11:00Z", endorsement: endorsed, validation: unvalidated }
    predicted_consequence:
      direction: [point_estimate_down]
      category: changes_magnitude_material
      magnitude_note: "Roughly halves the estimate."
      predicted_at: "2026-11-05T10:12:00Z"
      predicted_by: econ-001
    one_sentence_fact_risk: { level: medium, note: "Naming the estimator would make the task easy; the instruction must not name it. The cell weights in the estimand may themselves point to the estimator (rubric SP-3); the hint ladder will test this." }
    lifecycle: validated
    visibility: hidden
