target_analyses:
  - target_id: t-main-att
    paper_location: "Table 2, column 1"
    description:
      - lang: zh-Hans
        text: "政策对县级就业的平均处理效应（交错实施）。"
        is_original: true
      - lang: en
        text: "Average effect of the policy on county employment (staggered adoption)."
        is_original: false
        machine_translated: true
        translation_of: zh-Hans
        translator: "interviewer model (see interview record)"
    estimand:
      # (a) The estimand only: no comparison group and no estimator (verifier protocol §4 item 1).
      description:
        - lang: en
          text: "θ = Σ_{(g,t)∈C} N_g · ATT(g,t) / Σ_{(g,t)∈C} N_g, where ATT(g,t) = E[Y_it(g) − Y_it(∞) | G_i = g]. Y_it(g) is the log employment of county i in year t if its state first applies the policy in year g, and Y_it(∞) if the state never applies it; G_i is the county's adoption year; N_g is the number of counties in cohort g; C is the set of treated (cohort, year) cells with 0 ≤ t − g ≤ 4 and t ≤ 2019, for cohorts g = 2013, …, 2017. Equivalently: the average effect over all treated county-years in event years 0 to 4."
          is_original: true
      parameter: ATT
      population: "Counties in the 36 states that adopt the policy in 2013–2017; county panel 2010–2019"
      treatment: "The county's state applies the policy (absorbing); the adoption year g is the first year in which it applies"
      outcome: "Log of annual county employment"
      weights: "Each treated (cohort, year) cell in C weighted by its number of counties N_g, i.e. equal weight for every treated county-year"
      window: "Event years 0 to 4 after adoption, truncated at 2019"
      design: did_staggered
      # (b) Identifying assumptions, stated in the agent-facing instruction.
      identifying_assumptions:
        - statement_id: s-003
          text:
            - { lang: en, text: "A1 (comparison group): counties not yet treated in a given year, including the counties of the 12 states that never adopt the policy.", is_original: true }
          provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T09:20:00Z", endorsement: endorsed, validation: unvalidated }
        - statement_id: s-004
          text:
            - { lang: en, text: "A2 (parallel trends): absent the policy, expected log employment would have changed in parallel in every adoption cohort and in the comparison counties, in every year from 2010 to 2019, and hence from any base period, including g − 1.", is_original: true }
          provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T09:21:00Z", endorsement: endorsed, validation: unvalidated }
        - statement_id: s-005
          text:
            - { lang: en, text: "A3 (no anticipation): the policy has no effect on employment before its adoption year.", is_original: true }
          provenance: { origin: contributor, actor_id: econ-001, created_at: "2026-11-05T09:22:00Z", endorsement: endorsed, validation: unvalidated }
    outputs:
      - output_id: att-overall
        label: "Overall ATT (log employment)"
        value: 0.031
        std_error: 0.009
        n_obs: 24000
        n_clusters: 48
        tolerance: { kind: absolute, value: 0.000001, justification: "Numerical noise only: cross-software re-runs of the same estimator and conventions differed by less than 10⁻⁷ on the main data and on every hidden variant. Valid alternative estimators are not absorbed by this band; each is graded against its own conditional reference (decision space of task-ec-01)." }
