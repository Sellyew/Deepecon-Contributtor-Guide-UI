# ILLUSTRATIVE EXAMPLE ONLY — fictional paper, fictional people, fictional numbers.
# Purpose: show how the schema records provenance, bilingual text, an estimand kept apart from its
# identifying assumptions and from the estimator, a failure mode, a flawed variant, consequence evidence,
# and a task candidate with a decision space, per-output tiers, data routes, validation runs, and an
# exposure log. Nothing here describes a real study, and no number here is an empirical result.
