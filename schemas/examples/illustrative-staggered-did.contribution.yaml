target_analyses:
  - target_id: t-main-att
    paper_location: "Table 2, column 1"
    description:
      - lang: zh-Hans
        text: "政策对县级就业的平均处理效应（交错实施）。"
        is_original: true
      - lang: en
        text: "Average effect of the policy on county employment (staggered adoption)."
        is_original: false
        machine_translated: true
        translation_of: zh-Hans
        translator: "interviewer model (see interview record)"
    estimand:
      description:
        - lang: en
          text: "Average treatment effect on the treated, aggregated across adoption cohorts with cohort-size weights, using not-yet-treated counties as controls."
          is_original: true
      parameter: ATT
      design: did_staggered
    outputs:
      - output_id: att-overall
        label: "Overall ATT (log employment)"
        value: 0.031
        std_error: 0.009
        n_obs: 24000
        n_clusters: 48
        tolerance: { kind: in_reference_se_units, value: 0.25, justification: "Valid heterogeneity-robust estimators agree within 0.2 SE on this design (alternative implementation impl-alt-01)." }
