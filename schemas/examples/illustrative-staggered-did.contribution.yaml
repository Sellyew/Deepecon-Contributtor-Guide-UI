task_candidates:
  - task_id: task-ec-01
    task_type: error_correction
    target_capability:
      statement_id: s-020
      text:
        - { lang: en, text: "Recognize that the implemented estimator is invalid under staggered adoption with dynamic effects, and repair it while preserving the estimand.", is_original: true }
      provenance: { origin: shepherd, actor_id: shepherd-01, created_at: "2026-11-05T12:00:00Z", endorsement: endorsed, endorsed_by: econ-001, validation: unvalidated }
    source_refs: { target_ids: [t-main-att], failure_mode_ids: [fm-twfe], variant_ids: [v-twfe] }
    agent_facing:
      visibility: agent
      instruction:
        - { lang: en, text: "(Instruction text written by the shepherd and contributor; omitted in this illustration. It states the estimand θ, assumptions A1–A3, and state-level clustering, and never names the estimator.)", is_original: true }
      instruction_authorship: human_written
      provided_materials:
        - { path: "agent/data/county_panel.csv", visibility: agent, role: data, source_access: public_redistributable, data_route: redistributable_original }
        - { path: "agent/package/analysis.R", visibility: agent, role: code }
      output_contract:
        description: "Write results.json in the benchmark-wide results schema for this task type (estimate, standard error, confidence interval, N, number of clusters, cluster variable, estimation-sample hash; estimator family as ungraded free text), and provide run.R, which reproduces the results from the data path given as its first argument. Declare the variance convention from the convention vocabulary."
        results_path: "/workspace/results.json"
        results_schema: "agent/schemas/results-execution-correction.v1.json"
        code_entrypoint_required: true
        declared_choices_required: true
        convention_vocabulary: "DiD-family conventions v1 (agent/conventions/did-family.v1.yaml)"
        intermediate_outputs_required: [estimation_sample_hash, cohort_sizes, n_clusters]
      environment:
        languages: [{ name: r, version: "4.4.1" }]
        network_required: false
      internet_access: false
      time_limit_minutes: 120
    hidden:
      visibility: hidden
      verifier:
        methods: [acceptance_region, numeric_tolerance, hidden_variant_reexecution, metamorphic_relations]
        graded_outputs:
          - output_id: att-overall
            quantity: value
            verifiability_tier: V2a
            methods: [acceptance_region, hidden_variant_reexecution, metamorphic_relations]
            note: "The agent's code is re-run on hidden variants built on bases it never sees (state-resampled panels, outcome-perturbed copies; verifier protocol §5.1). Exact relations: injected effects that differ by cohort and grow with event time, added on the log scale, shift the estimate by the estimand-weighted τ; adding arbitrary county and year effects leaves it unchanged (§5.2–§5.3). On every input the estimate must also match the conditional reference of a selectable decision-space combination within the noise band."
          - output_id: att-overall
            quantity: std_error
            verifiability_tier: V1
            methods: [numeric_tolerance]
            tolerance: { kind: relative, value: 0.000001, justification: "Numerical noise only, for the declared variance convention." }
            note: "Deterministic comparison with the conditional reference for the declared variance convention, on the main data and on every hidden variant (verifier protocol §4 item 7)."
          - output_id: att-overall
            quantity: n_obs
            verifiability_tier: V1
            methods: [numeric_tolerance]
            tolerance: { kind: exact, value: 0 }
            note: "Obtained by re-executing the agent's code, not from its report (verifier protocol §4 item 5)."
        hidden_datasets:
          - { path: "hidden/variants/data/resampled-states-001.csv", visibility: hidden, role: data, source_access: public_redistributable, data_route: derived_from_redistributable }
      alternative_solution_impl_ids: [impl-alt-01]
      negative_controls:
        - { variant_id: v-twfe, expected_verdict: reject }
      decision_space:
        # The crux: graded only through outcomes on separating hidden variants, never declared.
        - decision_id: cd-estimator
          option_id: cs-not-yet-treated
          option: "Callaway–Sant'Anna group-time ATTs (not-yet-treated comparison, base period g − 1), aggregated with the estimand's cell weights"
          status: reference
          source: contributor
          requires: [cd-anticipation/none]
        - decision_id: cd-estimator
          option_id: imputation
          option: "Imputation estimator (Borusyak, Jaravel & Spiess) fitted on untreated county-years, aggregated with the estimand's cell weights"
          status: accepted
          source: reviewer
          requires: [cd-anticipation/none, cd-parallel-trends/all-years]
          note: "Needs parallel trends in all pre-periods, which assumption A2 states. Graded against its own conditional reference (impl-alt-01)."
        - decision_id: cd-estimator
          option_id: twfe-static
          option: "Static two-way fixed effects regression on a post-treatment indicator"
          status: unjustifiable
          source: contributor
          note: "Failure mode fm-twfe."
        # Assumptions the instruction states, recorded as single-option decisions so that options can require them.
        - decision_id: cd-parallel-trends
          option_id: all-years
          option: "Parallel trends in every year 2010–2019 (assumption A2)"
          status: reference
          source: contributor
        - decision_id: cd-anticipation
          option_id: none
          option: "No anticipation (assumption A3)"
          status: reference
          source: contributor
    review_status: draft
