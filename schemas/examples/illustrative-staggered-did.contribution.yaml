    failure_mode_id: fm-twfe
    base_impl_id: impl-ref-01
    patch: { path: "hidden/variants/v-twfe.patch", visibility: hidden, role: patch }
    authored_by: [research_assistant]
    naturalness_review: { tells_removed: true, reviewed_by: shepherd-01 }
    observed_outputs:
      - { output_id: att-overall, label: "Overall effect (TWFE)", value: 0.014, std_error: 0.008 }
    consequence:
      comparisons:
        - output_id: att-overall
          reference_value: 0.031
          flawed_value: 0.014
          difference: -0.017
          difference_in_reference_se: -1.89
          materiality_rule: "|diff| > 1 reference SE or significance change at 5%"
          material: true
      prediction_matched: matched
      robustness: { method: semi_synthetic, n_variants: 200, share_separated: 0.97, separation_margin: 5.6 }
    visibility: hidden
